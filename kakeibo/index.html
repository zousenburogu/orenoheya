<!DOCTYPE html>
<html lang="ja" data-version="2026.09.30-2">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>残高予測家計簿</title>
  <link rel="stylesheet" href="css/style.css?v=2026.09.30-2" />
</head>
<body>
  <header class="top">
    <div class="inner">
      <button class="back" id="backBtn" hidden>‹ 戻る</button>
      <h1 id="pageTitle">ホーム</h1>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <nav class="tabs" aria-label="メインメニュー">
    <div class="inner">
      <button data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>
        ホーム
      </button>
      <button data-tab="forecast">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19h18"/><path d="M4 15l5-5 4 3 7-8"/></svg>
        残高予測
      </button>
      <button data-tab="input" class="add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        入力
      </button>
      <button data-tab="analysis">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h12M4 12h16M4 18h8"/></svg>
        分析
      </button>
      <button data-tab="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
        メニュー
      </button>
    </div>
  </nav>

  <dialog class="sheet" id="sheet">
    <form method="dialog" id="sheetForm">
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button type="button" class="ghost small" id="sheetClose" aria-label="閉じる">閉じる</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </form>
  </dialog>

  <script src="js/dates.js?v=2026.09.30-2"></script>
  <script src="js/engine.js?v=2026.09.30-2"></script>
  <script src="js/chart.js?v=2026.09.30-2"></script>
  <script src="js/app.js?v=2026.09.30-2"></script>
</body>
</html>
